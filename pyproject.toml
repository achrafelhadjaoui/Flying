[project]
name = "flying"
version = "0.1.0"
description = "Drone routing simulation across a network of zones"
readme = "README.md"
authors = [
    { name = "achrafelhadjaoui", email = "aelhadjaoui23@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
exclude = ['^\.venv/']
